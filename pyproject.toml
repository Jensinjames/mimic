[project]
name = "mimic-client"
version = "0.2.0"
description = "Intercept an app and generate a Python client with OpenAI."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Divy Srivastava", email = "me@littledivy.com" }]
dependencies = [
  "requests>=2.28",
  "openai>=3.24.0,<4",
]

[project.optional-dependencies]
capture = ["mitmproxy>=10"]
dev = ["pytest>=8,<9"]

[project.scripts]
mimic = "mimic.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mimic*"]
